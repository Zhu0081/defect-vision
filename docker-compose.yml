# 一条命令起整套：数据库 + 应用
#
#   docker compose up -d --build     启动（-d 后台）
#   docker compose logs -f app       看应用日志
#   docker compose ps                看状态与健康
#   docker compose down              停掉（数据卷保留）
#   docker compose down -v           停掉并删库（慎用）
#
# 打开 http://127.0.0.1:8010/

services:
  db:
    image: postgres:17-alpine
    environment:
      # 密码不写死在文件里：从 .env 读，没写 .env 就退回默认值。
      # 这样仓库可以公开，真实密码只存在本机（.env 已在 .gitignore 里）。
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-defect}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-defect}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 不对外暴露 5432，避免和本机自己装的 PostgreSQL 抢端口
    #
    # restart 必须和 app 一致：Docker Desktop 开机自启时，
    # 带 unless-stopped 的容器会自动起来，没写这个的不会。
    # 只起 app 不起 db，app 就会报 failed to resolve host 'db' 并进入重启循环。
    # depends_on 的 condition 只在 `compose up` 时生效，管不了"单独自动重启"。
    restart: unless-stopped

  app:
    build: .
    ports:
      # 宿主 8010 → 容器 8000（宿主 8000 已经被本机直接跑的服务占了）
      - "8010:8000"
    environment:
      # 注意 host 写的是服务名 db，不是 localhost：
      # 容器里的 localhost 指的是容器自己
      DV_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-defect}
      DV_DEFAULT_CONF: "0.25"
      # AI 报告用的三个变量：从宿主机 .env 透传进容器。
      # 这里**不写默认值**，因为 key 绝不该有默认值；
      # 没配就留空，服务会自动降级成规则模板。
      DV_LLM_BASE_URL: ${DV_LLM_BASE_URL:-https://api.deepseek.com/v1}
      DV_LLM_API_KEY: ${DV_LLM_API_KEY:-}
      DV_LLM_MODEL: ${DV_LLM_MODEL:-deepseek-chat}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 上传的图放命名卷（不是宿主机目录）。
      # 实测：往 Windows 目录 bind mount 写一张 2.8MB 图要 1219ms，
      # 写命名卷只要 28ms —— Docker Desktop 的 9p/virtiofs 转发太慢。
      - uploads:/app/data/uploads
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
